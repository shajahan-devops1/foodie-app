# SonarQube / SonarCloud project configuration for Forkwise.
# Consumed by the `sonar-scanner` CLI (or the sonar-scanner Jenkins plugin)
# in the "Sonar Analysis" pipeline stage.

sonar.projectKey=forkwise-food-delivery-app
sonar.projectName=Forkwise Food Delivery App
sonar.projectVersion=1.0.0

# Two logical modules in one project: Node/Express API + React SPA.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.js,**/helm/**
sonar.test.inclusions=backend/tests/**/*.test.js

# Backend unit + API test coverage (lcov), produced by `npm run test:ci`
# in backend/ -> backend/coverage/lcov.info. Smoke tests are excluded from
# coverage collection on purpose (they hit a live deployment, not source).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# JUnit test results, produced by jest-junit -> backend/reports/junit.xml
sonar.testExecutionReportPaths=backend/reports/junit.xml

sonar.sourceEncoding=UTF-8

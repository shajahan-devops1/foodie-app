{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forkwise-backend.secretName" . }}
  labels:
    {{- include "forkwise-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  PGPASSWORD: {{ .Values.secret.pgPassword | quote }}
{{- end }}
